<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Show — Player</title>
  <link rel="stylesheet" href="styles.css">
  <script src="player.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p><span class="logo">✦</span> QUIZ SHOW</p>
      <p id="status">Connecting to the game server...</p>
    </header>

    <section id="join-section" hidden>
      <h2>Join game</h2>
      
      <form id="join-form">
        <label for="player-name">Your name</label>
        <input id="player-name" name="name" maxlength="24" required autocomplete="nickname">
        <button id="start-button" type="submit">Join</button>
      </form>
    </section>

    <section id="waiting-section" hidden>
      <h2>Lobby</h2>
      <p>Waiting for the host to start. Players connected: <span id="player-count">0</span></p>
    </section>

    <section id="question-section" hidden>
      <h2>Question <span id="question-number"></span> of <span id="question-count"></span></h2>
      
      <div class="timer_area">
        <p id="timer"></p>
      </div>

      <h3 id="question-prompt"></h3>
      <div id="answer-options"></div>
      <p id="answer-status"></p>
      <p>Score: <span id="score">0</span></p>
    </section>

    <section id="reveal-section" hidden>
      <h2>Answer</h2>
      <p id="correct-answer"></p>
      <p>Score: <span id="reveal-score">0</span></p>
    </section>

    <section id="results-section" hidden>
      <h2>Final standings</h2>
      <p id="placement"></p>
      <p>Your score: <span id="final-score">0</span></p>
    </section>
  </main>
</body>
</html>
